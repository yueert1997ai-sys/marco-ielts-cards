<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11110f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Marco 的极简 IELTS 随机单词卡" />
    <title>Marco IELTS Cards</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <p class="brand">Marco IELTS Cards</p>
        <p id="counter" class="counter" aria-live="polite">— / —</p>
      </header>

      <nav class="controls" aria-label="学习范围">
        <div class="segmented" aria-label="学习模式">
          <button class="mode-button is-active" type="button" data-mode="all" aria-pressed="true">随机</button>
          <button class="mode-button" type="button" data-mode="weak" aria-pressed="false">
            不会的 <span id="weak-count" class="weak-count">0</span>
          </button>
          <button class="mode-button" type="button" data-mode="daily" aria-pressed="false">今日 50</button>
        </div>

        <div class="filters" aria-label="优先级筛选">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-filter="S" aria-pressed="false">S</button>
          <button class="filter-button" type="button" data-filter="A" aria-pressed="false">A</button>
          <button class="filter-button" type="button" data-filter="B" aria-pressed="false">B</button>
        </div>
      </nav>

      <section id="daily-dashboard" class="daily-dashboard" aria-label="每日训练进度" hidden>
        <div class="daily-summary">
          <div>
            <p id="daily-title" class="daily-title">今日训练</p>
            <p class="daily-stats">
              认识 <strong id="daily-known">0</strong>
              <span aria-hidden="true">·</span>
              不会 <strong id="daily-weak">0</strong>
              <span aria-hidden="true">·</span>
              当前 <strong id="daily-level">S</strong> 级
              <span aria-hidden="true">·</span>
              连续 <strong id="daily-streak">0</strong> 天
            </p>
          </div>
          <p class="daily-total"><strong id="daily-completed">0</strong><span>/50</span></p>
        </div>
        <div id="daily-progress" class="daily-progress" role="progressbar" aria-label="今日训练完成进度" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
          <span id="daily-progress-fill" class="daily-progress-fill"></span>
        </div>
        <div id="daily-calendar" class="daily-calendar" aria-label="近七天训练记录"></div>
      </section>

      <main class="card-stage">
        <article id="word-card" class="word-card" role="button" tabindex="0" aria-label="翻开单词卡" aria-pressed="false">
          <section id="card-front" class="card-face card-front">
            <h1 id="front-word" class="front-word">loading</h1>
          </section>

          <section id="card-back" class="card-face card-back" hidden>
            <h2 id="back-word" class="back-word"></h2>
            <div class="word-meta" aria-label="词条信息">
              <span id="priority-badge" class="priority-badge"></span>
              <span id="part-of-speech" class="part-of-speech"></span>
            </div>
            <p id="meaning" class="meaning"></p>

            <div id="paraphrase-block" class="detail-block">
              <p class="detail-label">同义词 / 可靠改写</p>
              <p id="paraphrases" class="detail-copy"></p>
            </div>

            <div id="collocation-block" class="detail-block" hidden>
              <p class="detail-label">常见搭配</p>
              <p id="collocations" class="detail-copy detail-copy-muted"></p>
            </div>
          </section>
        </article>
      </main>

      <section class="actions" aria-label="单词操作">
        <button id="show-answer" class="answer-button" type="button">显示答案</button>
        <div id="rating-actions" class="rating-actions" hidden>
          <button id="mark-weak" class="action-button weak-button" type="button">不会</button>
          <button id="mark-known" class="action-button known-button" type="button">会了</button>
          <button id="skip-word" class="action-button skip-button" type="button">下一张</button>
        </div>
      </section>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <details class="progress-tools">
        <summary>进度管理</summary>
        <div class="progress-actions">
          <button id="export-progress" class="utility-button" type="button">备份进度</button>
          <button id="import-progress" class="utility-button" type="button">恢复进度</button>
          <input id="progress-file" type="file" accept="application/json,.json" hidden />
        </div>
        <p class="progress-note">进度只属于当前浏览器；分享网页链接不会共享你的记录。</p>
      </details>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
